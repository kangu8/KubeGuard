
apiVersion: v1
kind: Pod
metadata:
  name: authorized-client
  namespace: kubeguard
  labels:
    app: authorized-client
    access: kubeguard-api
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
