
apiVersion: v1
kind: Namespace
metadata:
  name: kubeguard-attack
  labels:
    role: attacker
---
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: kubeguard-attack
  labels:
    app: attacker
spec:
  containers:
    - name: attacker
      image: curlimages/curl:8.11.1
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
