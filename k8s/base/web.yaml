
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeguard-web
  namespace: kubeguard
  labels:
    app: kubeguard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeguard-web
  template:
    metadata:
      labels:
        app: kubeguard-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kubeguard-web
  namespace: kubeguard
spec:
  type: ClusterIP
  selector:
    app: kubeguard-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
